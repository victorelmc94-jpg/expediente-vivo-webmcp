<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Expediente Vivo architecture</title>
  <desc id="desc">Synthetic PDFs enter one private Cloud Run service, are processed by a Google ADK agent using Gemini 3.7 Flash on Vertex AI, validated by deterministic safety gates, persisted in private Cloud Storage and rendered as a traceable dossier.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaf6"/><stop offset="1" stop-color="#eef5f0"/></linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c3e31"/><stop offset="1" stop-color="#17644b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#17352b" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#557169"/></marker>
    <style>
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.serif{font-family:Georgia,Times New Roman,serif}.title{font-size:58px;fill:#14221e;letter-spacing:-2px}.subtitle{font-size:21px;fill:#60706a}.eyebrow{font-size:14px;font-weight:800;letter-spacing:3px;fill:#155b45}.eyebrow-light{font-size:14px;font-weight:800;letter-spacing:3px;fill:#a9e2ca}.box-title{font-size:22px;font-weight:800;fill:#14221e}.box-copy{font-size:16px;fill:#60706a}.box-copy-light{font-size:16px;fill:#c5ddd3}.label{font-size:14px;font-weight:800;fill:#155b45}.chip{font-size:13px;font-weight:800;fill:#155b45}.chip-light{font-size:13px;font-weight:800;fill:#e2f5ed}.white{fill:#fff}.line{stroke:#557169;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="90" y="78" class="sans eyebrow">ALL THINGS AGENTIC · THE TASKMASTER</text>
  <text x="90" y="145" class="serif title">Expediente Vivo</text>
  <text x="90" y="185" class="sans subtitle">One autonomous workflow. Every supported claim traced to its exact source.</text>

  <rect x="70" y="245" width="260" height="250" rx="26" fill="#fffefb" stroke="#d9ddd5" filter="url(#shadow)"/>
  <circle cx="130" cy="310" r="30" fill="#dff2e9"/>
  <path d="M116 292h21l9 9v29h-30zM137 292v11h9M122 312h17M122 320h12" fill="none" stroke="#155b45" stroke-width="3"/>
  <text x="105" y="370" class="sans box-title">User + web UI</text>
  <text x="105" y="407" class="sans box-copy">Mixed synthetic PDFs</text>
  <text x="105" y="435" class="sans box-copy">One clear action</text>
  <rect x="105" y="454" width="176" height="27" rx="13" fill="#fff0c9"/><text x="121" y="473" class="sans chip" fill="#725107">No legal advice</text>

  <path d="M330 370H430" class="line"/>
  <text x="352" y="349" class="sans label">PDF batch</text>

  <rect x="430" y="225" width="790" height="535" rx="36" fill="url(#cloud)" filter="url(#shadow)"/>
  <text x="475" y="275" class="sans eyebrow-light">ONE PRIVATE CLOUD RUN SERVICE</text>
  <text x="475" y="320" class="serif white" font-size="36">UI · API · ADK · safety gates</text>

  <rect x="475" y="365" width="205" height="140" rx="20" fill="#fffefb"/>
  <circle cx="515" cy="405" r="18" fill="#dff2e9"/><text x="509" y="411" class="sans label">1</text>
  <text x="505" y="450" class="sans box-title">PDF intake</text>
  <text x="505" y="478" class="sans box-copy">Page text · hashes</text>
  <text x="505" y="498" class="sans box-copy">Exact deduplication</text>

  <path d="M680 435H725" class="line" stroke="#b7d9ca"/>
  <rect x="725" y="365" width="205" height="140" rx="20" fill="#fffefb"/>
  <circle cx="765" cy="405" r="18" fill="#dff2e9"/><text x="759" y="411" class="sans label">2</text>
  <text x="755" y="450" class="sans box-title">ExpedienteAgent</text>
  <text x="755" y="478" class="sans box-copy">Google ADK runner</text>
  <text x="755" y="498" class="sans box-copy">Typed analyses + claims</text>

  <path d="M930 435H975" class="line" stroke="#b7d9ca"/>
  <rect x="975" y="365" width="200" height="140" rx="20" fill="#fffefb"/>
  <circle cx="1015" cy="405" r="18" fill="#fff0c9"/><text x="1009" y="411" class="sans label" fill="#725107">3</text>
  <text x="1005" y="450" class="sans box-title">Safety gates</text>
  <text x="1005" y="478" class="sans box-copy">Provenance · roles</text>
  <text x="1005" y="498" class="sans box-copy">Deadlines · conflicts</text>

  <path d="M825 365V335H1315V390" class="line" stroke="#f2b84b"/>
  <text x="990" y="350" class="sans chip-light">ADK → VERTEX AI MODEL CALL</text>
  <rect x="1260" y="305" width="260" height="170" rx="24" fill="#fffefb" stroke="#d9ddd5" filter="url(#shadow)"/>
  <text x="1295" y="350" class="sans eyebrow">VERTEX AI · REAL CALL</text>
  <text x="1295" y="390" class="sans box-title">Gemini 3.7 Flash</text>
  <text x="1295" y="421" class="sans box-copy">Interprets page text</text>
  <text x="1295" y="446" class="sans box-copy">Returns typed JSON proposals</text>

  <path d="M1075 505V530H825V548" class="line" stroke="#b7d9ca"/>
  <rect x="600" y="548" width="450" height="158" rx="22" fill="#143f33" stroke="#5d8b78"/>
  <text x="635" y="588" class="sans eyebrow-light">VERIFIED DOSSIER ASSEMBLY</text>
  <text x="635" y="627" class="sans white" font-size="22" font-weight="800">Matters · timeline · amounts · state</text>
  <text x="635" y="656" class="sans box-copy-light">Safe next step · uncertainty · human review</text>
  <rect x="635" y="671" width="335" height="24" rx="12" fill="#2b6854"/><text x="651" y="688" class="sans chip-light">0 critical errors · 100% provenance</text>

  <path d="M1050 625H1290" class="line"/>
  <rect x="1290" y="545" width="230" height="170" rx="24" fill="#fffefb" stroke="#d9ddd5" filter="url(#shadow)"/>
  <text x="1325" y="590" class="sans eyebrow">CLOUD STORAGE</text>
  <text x="1325" y="630" class="sans box-title">Private + temporary</text>
  <text x="1325" y="660" class="sans box-copy">Inputs · dossier.json</text>
  <text x="1325" y="685" class="sans box-copy">Run report · 1-day lifecycle</text>

  <path d="M600 625H360V610H225V515" class="line"/>
  <text x="290" y="580" class="sans label">Verified dossier</text>

  <rect x="90" y="805" width="1420" height="1" fill="#d9ddd5"/>
  <text x="90" y="845" class="sans box-copy">Gemini interprets page packets and returns typed JSON. Deterministic rules validate provenance and critical semantics.</text>
  <text x="1365" y="845" class="sans label">EU · IAM · SCALE TO ZERO</text>
</svg>
